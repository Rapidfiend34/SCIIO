<body>
  <main id="screen-holder" aria-label="Última Señal: terminal de escucha de la estación Nadir">
    <canvas id="screen" tabindex="0" aria-label="Terminal de Última Señal. Usa los botones o escribe comandos. Flechas y Enter seleccionan controles. Teclas 1 a 7 cambian de sector, 8 abre el cuaderno y P ofrece una pista. Escape cierra ventanas. Arrastra para girar la escena 3D."></canvas>
    <div id="accessible-copy" class="accessible" role="document" aria-label="Current product content"></div>
    <div id="accessible-controls" class="accessible" aria-label="Terminal controls"></div>
    <div id="accessible-status" class="accessible" role="status" aria-live="polite"></div>
    <label for="terminal-input" class="accessible">Orden del terminal</label>
    <input id="terminal-input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64" aria-label="Escribir orden. Pulsa Enter para enviarla.">
    <div id="fallback" hidden><p>NO SE PUEDE INICIAR EL ENLACE VISUAL.</p><p>Activa WebGL en tu navegador y vuelve a conectar.</p><button id="reconnect">RECONECTAR ↵</button></div>
  </main>
  <noscript>Última Señal necesita JavaScript y WebGL. El registro del juego solo pide un alias ficticio, sin correo ni contraseña reales. Recupera tu sesión, reconstruye recuerdos y decide en quién confiar.</noscript>
  <script src="/assets/hermes-content.js" defer></script>
  <script src="/assets/signal-game.js" defer></script>
  <script src="/assets/terminal.js" defer></script>
