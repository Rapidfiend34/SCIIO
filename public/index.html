  <main id="screen-holder" aria-label="Ardor interactive product explorer">
    <canvas id="screen" tabindex="0" aria-label="Ardor character terminal. Arrow keys select controls; Enter opens them. Keys 1, 2 and 3 explore cloud work, private team collaboration and real serverless apps. C chooses a color. U opens the current story. K opens a secret ASCII signal. Shift with arrow keys rotates the 3D image. Press question mark for all shortcuts. Enter or Escape skips the introduction."></canvas>

    <div id="accessible-status" class="accessible" role="status" aria-live="polite"></div>
    <label for="terminal-input" class="accessible">Ardor explorer command</label>
    <input id="terminal-input" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="64" aria-label="Terminal command. Press Enter to send.">
